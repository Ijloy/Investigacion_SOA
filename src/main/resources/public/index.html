<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BikeStore Async</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1d2433; }
    h1 { margin-bottom: 4px; } p.sub { color: #5b6476; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    td, th { padding: 8px; border-bottom: 1px solid #e3e6ec; text-align: left; }
    input { padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 8px; border: 1px solid #c9ced8; border-radius: 6px; }
    button { padding: 10px 18px; background: #1f6feb; color: #fff; border: 0; border-radius: 6px; font-size: 15px; cursor: pointer; }
    pre { background: #f4f6f9; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>BikeStore</h1>
  <p class="sub">Front-end de prueba: confirma el pedido y mira la consola de Java.</p>

  <input id="cliente" value="Dereck Proaño" placeholder="Nombre">
  <input id="email" value="cliente@bikestore.ec" placeholder="E-mail">

  <table>
    <tr><th>Producto</th><th>Cant.</th><th>Precio</th></tr>
    <tr><td>Bicicleta MTB Trek Marlin 5</td><td>1</td><td>$749.00</td></tr>
    <tr><td>Casco Giro Register</td><td>2</td><td>$45.50</td></tr>
  </table>

  <button id="ordenar">Confirmar pedido</button>
  <pre id="out">Respuesta del API aparecerá aquí.</pre>

  <script>
    document.getElementById('ordenar').onclick = async () => {
      const pedido = {
        cliente: document.getElementById('cliente').value,
        email: document.getElementById('email').value,
        items: [
          { producto: 'Bicicleta MTB Trek Marlin 5', cantidad: 1, precioUnitario: 749.00 },
          { producto: 'Casco Giro Register', cantidad: 2, precioUnitario: 45.50 }
        ]
      };
      const out = document.getElementById('out');
      try {
        const r = await fetch('/ordenar', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pedido)
        });
        out.textContent = r.status + ' ' + r.statusText + '\n' + JSON.stringify(await r.json(), null, 2);
      } catch (e) {
        out.textContent = 'Error: ' + e;
      }
    };
  </script>
</body>
</html>
